spring:
  application:
    name: gatewayServer
  cloud:
    gateway:
      routes:
        - id: configClientDemo
          uri: lb://configClientDemo
          predicates:
            - Path=/configClient/**
          filters:
            - StripPrefix=1
        - id: configServerDemo
          uri: lb://configServerDemo
          predicates:
            - Path=/configServer/**
          filters:
            - StripPrefix=1
            - name: LoggingGatewayFilterFactory
            - AddRequestHeader=X-Request-Id, "1234"
            - AddResponseHeader=X-Response-Id, "5678"
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT
    loadbalancer:
      retry:
        enabled: true
        max-attempts: 2


resilience4j:
  configs:
    default:
      slidingWindowType: COUNT_BASED
      slidingWindowSize: 100
      minimumNumberOfCalls: 10
      permittedNumberOfCallsInHalfOpenState: 10
      waitDurationInOpenState: 10s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10
      recordExceptions:
        - java.io.IOException
        - java.util.concurrent.TimeoutException
      ignoreExceptions: []
    slowCallConfig:
      slidingWindowType: TIME_BASED
      slidingWindowSize: 60
      slowCallDurationThreshold: 2s
      slowCallRateThreshold: 100

  circuitbreaker:
    configs:
      default: default
      slowCalls: slowCallConfig
    instances:
      backendA:
        baseConfig: default
      backendSlow:
        baseConfig: slowCalls

  retry:
    instances:
      backendA:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - java.io.IOException
        ignoreExceptions: []
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

  ratelimiter:
    instances:
      backendA:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0

  bulkhead:
    instances:
      backendA:
        maxConcurrentCalls: 20
        maxWaitDuration: 0
      backendThreadPool:
        maxConcurrentCalls: 20
        maxWaitDuration: 0

  timelimiter:
    instances:
      backendA:
        timeoutDuration: 2s
        cancelRunningFuture: true


server:
  port: 8083
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    instance:
      prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: '*'

